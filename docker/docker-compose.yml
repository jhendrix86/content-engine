version: '3.8'

services:
  content-engine:
    build:
      # Workspace root, not just this repo - needed to reach the
      # unkey-auth sibling package the Dockerfile copies in (see its own
      # comment for why). Run `docker compose -f docker/docker-compose.yml
      # build` from content-engine/ as before; this context path is
      # relative to this compose file's own location either way.
      context: ../..
      dockerfile: content-engine/docker/Dockerfile
    container_name: content-engine
    ports:
      - "8040:8040"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/content
      - REDIS_URL=redis://redis:6379/1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AI_MODEL=${AI_MODEL:-gpt-4}
      - WORDPRESS_URL=${WORDPRESS_URL}
      - WORDPRESS_USERNAME=${WORDPRESS_USERNAME}
      - WORDPRESS_APP_PASSWORD=${WORDPRESS_APP_PASSWORD}
      - DEVTO_API_KEY=${DEVTO_API_KEY}
      - UNKEY_ROOT_KEY=${UNKEY_ROOT_KEY}
      - UNKEY_API_ID=${UNKEY_API_ID}
      - UNKEY_BASE_URL=${UNKEY_BASE_URL:-https://api.unkey.com/v2}
      - DEBUG=${DEBUG:-false}
      - MARKETING_AUTOMATION_URL=http://marketing-automation-engine:8039
      - ANALYTICS_ENGINE_URL=http://analytics-engine:8042
      - FUNNEL_AUTOMATION_URL=http://funnel-automation-engine:8000
    # No depends_on here - postgres/redis moved to shared infra
    # (deploy/docker-compose.infra.yml), a different compose project.
    # Bring that up first: deploy/03-build-and-up.sh infra-up
    networks:
      - os42-shared
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8040/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  os42-shared:
    external: true
