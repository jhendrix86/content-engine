name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

# This repo editable-installs sibling packages (unkey-auth, empire-operators)
# via `-e ../<name>` in requirements.txt. CI clones them next to the checkout
# first. Needs a repo/org secret `CI_FLEET_TOKEN` - a PAT (fine-grained,
# Contents:read) with access to the sibling repos under jhendrix86/. Without
# it the sibling clone step fails with a clear message.
jobs:
  test:
    runs-on: ubuntu-latest
    # Cap the job so a hung test surfaces in ~minutes, not after the
    # default 6h. pytest-timeout (below) kills the individual offender
    # first and prints its traceback; this is the outer backstop.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Clone sibling packages
        run: |
          if [ -z "${{ secrets.CI_FLEET_TOKEN }}" ]; then
            echo "::error::CI_FLEET_TOKEN secret is not set - cannot clone private sibling repos (unkey-auth, empire-operators)."
            exit 1
          fi
          for s in unkey-auth empire-operators; do
            git clone --depth 1 \
              "https://x-access-token:${{ secrets.CI_FLEET_TOKEN }}@github.com/jhendrix86/$s.git" "$s"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: repo/requirements.txt

      - name: Install dependencies
        working-directory: repo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-timeout

      - name: Run tests
        working-directory: repo
        # --timeout: kill any single test stuck >60s and dump its traceback
        # (a hung network call / TestClient lifespan deadlock names itself
        # instead of silently eating the whole job).
        run: pytest -q --timeout=60 --timeout-method=thread
